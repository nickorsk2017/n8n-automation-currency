services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Non-secret operational config, deliberately here and not in the gitignored
      # .env: the Schedule Trigger in workflows/1-currency-rate-loader.json fires at
      # 06:00 resolved against the *instance* timezone, so "06:00 UTC" is only true
      # if every stand pins it identically. GENERIC_TIMEZONE drives n8n scheduling;
      # TZ aligns the container clock so logs and Code-node timestamps agree.
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows

volumes:
  n8n_data:
